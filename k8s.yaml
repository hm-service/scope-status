---
apiVersion: v1
kind: ConfigMap
metadata:
    name: scope-status-env
data:
    DATA_DIR: "/data"
    TZ: "Asia/Shanghai"
    HOST: "0.0.0.0"
    PORT: "8080"
    # /readyz?token=<这个值>；留空就是不校验
    READYZ_TOKEN: "your_readyz_token"
    # 反代网段：只有来自这些来源的 X-Forwarded-For 才可信
    TRUSTED_PROXIES: "127.0.0.1/32,::1/128,10.89.2.0/24"
    STREAM_INTERVAL: "5"
    MAX_API_CONCURRENCY: "128"
    MAX_STATIC_CONCURRENCY: "64"
    MAX_UPLOAD_BYTES: "1073741824"
    GOMEMLIMIT: "128MiB"

---
# 条目 / 服务 / 网站配置，挂成 DATA_DIR 根下的 source.yaml（默认路径）。
# 这里放的是示例，正式的条目自己加；里面可能有密码，改用 Secret 也行。
apiVersion: v1
kind: ConfigMap
metadata:
    name: scope-status-source
data:
    source.yaml: |
        title: Scope Status
        probe:
          method: icmp
          timeout: 2
          concurrency: 16
        categories:
          - id: friend
            label: 朋友
            order: 1
        friends:
          - name: 示例
            addresses: ["10.0.0.2"]

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: scope-status-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: scope-status
    labels:
        app: scope-status
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: app
          image: ghcr.io/<owner>/scope-status:latest
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL

          envFrom:
              - configMapRef:
                    name: scope-status-env
          ports:
              - name: http
                containerPort: 8080
                protocol: TCP

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 256Mi

          # 存活探针只看进程，且不记日志；就绪探针查依赖（数据目录可写）并记一条审计日志
          livenessProbe:
              httpGet:
                  path: /livez
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readinessProbe:
              httpGet:
                  path: /readyz?token=your_readyz_token
                  port: http
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3

          volumeMounts:
              - name: data
                mountPath: /data
              - name: source
                mountPath: /data/source.yaml
                subPath: source.yaml
                readOnly: true
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: scope-status-data
        - name: source
          configMap:
              name: scope-status-source
